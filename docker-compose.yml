services:
  # ====================
  # MongoDB
  # ====================
  mongo:
    image: mongo:7.0
    container_name: stock-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    # ⚠️ 生产部署应移除端口映射或添加 MongoDB 密码认证
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=stock_analysis
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================
  # Redis
  # ====================
  redis:
    image: redis:7-alpine
    container_name: stock-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # ⚠️ 生产部署应移除端口映射或添加 Redis 密码认证
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================
  # Backend API
  # ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
    env_file:
      # ⚠️ 安全说明：
      # env_file 仅在容器运行时注入环境变量，不会写入镜像层。
      # 生产环境应使用 .env.production 并确保文件权限 600：
      #   chmod 600 .env.production
      # 或在 CI/CD 管道中通过 secrets 管理平台注入。
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ====================
  # Frontend
  # ====================
  frontend:
    image: node:20-alpine
    container_name: stock-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # ====================
  # Frontend (生产环境, Nginx)
  # ====================
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      # 生产环境需要准备 SSL 证书：
      #   mkdir -p ./certs && openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
      #     -keyout ./certs/server.key -out ./certs/server.crt -subj "/CN=localhost"
      - ./certs:/etc/nginx/ssl:ro
    profiles:
      - production

volumes:
  mongo_data:
  redis_data:
